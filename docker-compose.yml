version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_erp_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_PREFIX=/api/v1
      - JWT_ACCESS_SECRET=development_access_secret_key_32_chars_long
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_SECRET=development_refresh_secret_key_32_chars_long
      - JWT_REFRESH_EXPIRATION=7d
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
